# Approach D v1.0 overlay (approachD_methodology.pdf §6). config.toml is NOT edited: its hash is pinned by archived plans and the six
# historical replays (audit.py), exactly as config_v2.toml was introduced. Sections arrive when code first reads them; G1 reads
# [relative_lookup] only (p15_lookup.rel_cfg validates the exact key set: unknown or missing keys fail).
# Spec knob mapping: patches = [3, 4] <=> alpha_3 > 0 and alpha_4 > 0 (no second authority); online_fallback / allow_absolute_fallback
# belong to the G2 motion provider and are not read yet.

[relative_lookup]
key = "delta_rc_and_footprint"          # "absolute_src_dst" = legacy P14/P15 exact-cell lookup (switchable baseline)
alpha_3 = 0.5                           # alpha_3 = alpha_4 = 0.5, alpha_global = 0.25, alpha_rho = 0 reproduces the legacy combined
alpha_4 = 0.5                           # score (mean of the four windows + 0.25 x global agreement) entry by entry
alpha_global = 0.25
alpha_rho = 0.0                         # robot-base term (rotation residual): ablation only until G2 evidence exists
rho_scale_m = 0.08                      # sim_rho = 1 / (1 + residual / rho_scale_m); one cell pitch
local_sweep_cheb = 2                    # object-local sweep = swept cells within Chebyshev 2 of source or destination
mode_iou = 0.6                          # same as the P14/P15 mode threshold
mode_limit = 3                          # engineering default (spec §4.3), not a validated optimum
witnesses_per_mode = 2
status_on_no_witness = "UNKNOWN_NO_WITNESS"

# G2a (approachD_G2_offline_only_instructions_v1_1): OFFLINE compiler. IK, IK-tracked lines and the certified planner run only here, before
# inference. ad_compile.ccfg validates the exact key set. Node budgets decide (planner wall clock disabled), so compiles are deterministic.
[compiler]
version = "AD_COMPILER_V1"
fixture = "GENERIC_EMPTY_WORKSPACE"     # the moved disc alone: no root, split or held-out scene geometry enters a template
contract = "Q_HOME"                     # every template starts and ends exactly at q_home; root start q -> home only via ENTRY templates
budget_id = "B_COMPILE_V1"
planner_max_nodes = 4000                # config.toml planner2d canonical node budget
templates_per_mode = 2                  # per relative mode: first distinct snapped grasp classes in canonical member order
direct_k = 6                            # unseeded baselines (planner order / branch-spread), same K as the 3x2 and 6x1 shortlists
max_grasp_shift_deg = 30.0              # rotated seed grasp -> declared grasp on the same branch: at most two 15-degree steps

# G2a runtime contract (ad_runtime): frozen templates only; no IK, planner, connector or grasp synthesis is reachable.
[runtime]
version = "AD_RUNTIME_V1"
check_budget = 6                        # exact certifications per requested move
prefilter = true                        # swept-cell prefilter rejects only (conservative); the certifier alone accepts
start_tol_rad = 1e-9                    # exact start-q continuity (canonical home)

# G2b (approachD_G2b_solver_free_provider_instructions_v1_2): AD_PRECOMPILED provider over the finite robot-state graph. Opt-in only:
# no historical arm reads this section. ad_provider.pcfg validates the exact key set.
[provider]
version = "AD_PRECOMPILED_V1"
tiers = ["exact", "relative"]           # "catalog" (generic offline DIRECT templates) is an explicit, separately reported extension
rank = "patch"                          # relative tier: "patch" (G1 3x3/4x4 + global), "geometry" (base-rotation residual only), "random"
mode_limit = 6                          # 6 modes x 1 (3 x 2 stays configurable; DEV results do not separate them)
per_mode = 1
action_budget = 6                       # exact certifications of object actions per move (connector certifications counted separately)
max_hops = 2                            # stored connectors chained to reach an action's start node (e.g. retreat -> home -> approach)
prefilter = "OFF"                       # OFF | ADVISORY | HARD; HARD saves ~6x certifications on DEV but rejected valid paths
